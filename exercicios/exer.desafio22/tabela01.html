<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        td{
            border: 1px solid black;
            padding: 8px;
        }
        table{
            width: 400px;
            border-collapse:separate ;
        }
        tr{
            background-color: aquamarine;
        }
         tr.linha{
            background-color: brown;
         }
          td.dados1{ background-color: blueviolet;}

          td.dados2{ background-color: blueviolet;}
           
          td.dados3{ background-color: chocolate;}
 

    </style>
</head>
<body>
    <h1>minha primeira tabela</h1>
    
    <table>
        <tr class="linha">
            <td>a1</td>
            <td>b1</td>
            <td>c1</td>
        </tr>

        <tr>
            <td class="dados3">a2</td>
            <td>b2</td>
            <td class="dados1">c2</td>
        </tr>

        <tr>
            <td>a3</td>
            <td>b3</td>
            <td class="dados2">c3</td>
        </tr>
        
        <tr>
            <td>a4</td>
            <td>b4</td>
            <td>c4</td>
        </tr>
        
    </table>
    
</body>
</html>
