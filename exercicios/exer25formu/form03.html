<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>teste de formulario</h1>
    
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="nome completo" autocomplete="name">  
        </p>

        <p>
            <label for="inotas">notas</label>
            <input type="number" name="notas" id="inotas" minlength="0" maxlength="10" placeholder="nota de 0 á 10" step="0.5">
        </p>

        <p>
            <label for="imes">ano letivo</label>
            <input type="month" name="ano letivo" id="imes">
        </p>
        
        <p><label for="idat"> dia da prova</label>
         <input type="date" name="dia da prova" id="idat">
        </p>

        <p>
            <label for="ihora">horario da prova</label>
            <input type="time" name="horario da prova" id="ihora">
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
    
</body>
</html>
