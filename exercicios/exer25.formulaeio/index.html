<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        html{
            background-color:rgb(177, 177, 187) ;
        }
    </style>
</head>
<body>
    <h1>cadastre-se no formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        
    <fieldset>
        <legend>atleta</legend> 
          <p>
            nome completo
            <input type="text" name="" id="Nome do cliente">
            <input type="submit" value="cadastrar">
          </p>
       
    </fieldset>


        <fieldset>
            <legend>sexo</legend>
            <input type="radio" name="sexo" id="isxmas"> <label for="isxmas">masculino</label>
            <input type="radio" name="sexo" id="isxfemi"> <label for="isxfemi">feminino</label>
        </fieldset>



        <fieldset>
            <legend>ate marcial</legend>
           
            <input type="checkbox" name="esjiu" id="ijiu"> <label for="ijiu">jiujitsu</label>
            

        <fieldset>
            <legend> sua graduação </legend>
            <p>
                <label for="icor"> graduação jiujitsu</label>
                <input type="color" name="cor" id="icor">

                <input type="checkbox" name="esbranca" id="ibranca"> <label for="ibranca">branca</label>

            <input type="checkbox" name="esazul" id="iazul"> <label for="iazul">azul</label>

            <input type="checkbox" name="esroxa" id="iroxa"> <label for="iroxa">roxa</label>

            <input type="checkbox" name="esmarrom" id="imarrom"> <label for="imarrom">marrom</label>

            <input type="checkbox" name="espreta" id="ipreta"> <label for="ipreta">preta</label>
            
        </fieldset>

        <fieldset>
            <legend> nivel de satisfação</legend>


            <p>
                <label for="inum"> numero </label>
                <input type="range" name="num" id="inum" min="1" max="10" value="5" oninput="ival.innerHTML = Number(inum.value)">
                <output id="ival">5</output>
            </p>
            
        </fieldset>

        <fieldset>
            <legend>unidades por cidades</legend>

            <label for="icida">cidades</label>
            <select name="cidade" id="icida">
                <option value="ro">academia matriz</option>
                <option value="ro">academia 2</option>
                <option value="ro">academia 3</option>
                <option value="ro">academia 4</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>somatória</legend>
            <p>
                <label for="in1">numero1:</label>
                <input type="number" name="n1" id="in1" min="0" max="50" oninput="isoma.innerHTML = Number( in1.value) + numer( in2.value)"> <br>
                <label for="in2">numero2:</label>
                <input type="number" name="n2" id="in2" min="0" max="50" oninput="isoma.innerHTML = Number( in1.value) + Number( in2.value)">
            
            </p>
            <p>
                <label for="isoma">soma: </label>
                <output name="soma" id="isoma">0</output>
            </p>
        </fieldset>

        <fieldset> 
            <legend>sua idade</legend>
            <p>
            <label for="iano">em que ano voçe nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2040" oninput="calcIdade()">
          </p>

          <p>
            <label for="iidade">sua idade é: </label>
            <output id="iidade">0</output>
          </p>

        </fieldset>
        
        <fieldset>
            <legend> mesagem de melhorias ou reclamações</legend>
        <p>
            <label for="imsg">digite aqui</label>
            <textarea name="msg" id="imsg"></textarea>
        </p>
          </fieldset>

          <p> <p>
           <a href="index1.html">enviar</a>
           <input type="reset" value="limpar">
        </p></p>

    </form>
     
    <script>
        function calcIdade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
    
</body>
</h
